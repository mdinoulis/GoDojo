# KataGo analysis-engine config used by the Go app (PC / desktop testing).
# Per-query values (maxVisits, humanSLProfile, ...) are overridden by the app.
logDir = logs
logToStderr = false
reportAnalysisWinratesAs = BLACK
maxVisits = 500
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 16
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
